name: 'Terraform CI/CD'

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  terraform:
    name: 'Terraform Validation & Plan'
    runs-on: ubuntu-latest

    # Utiliza um ambiente (Environment) opcional para controlar a aprovação manual da aplicação
    
    environment: production

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.5.0

    - name: Verificar Formatação do Terraform
      run: terraform fmt -check

    - name: Inicializar o Terraform
      run: terraform init

    - name: Validar a Configuração
      run: terraform validate

    - name: Gerar o Plano de Execução do Terraform
      run: terraform plan

      # Se estiveres a usar credenciais falsas para fins educacionais, podes adicionar envs fictícios aqui se necessário:

      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || 'test' }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || 'test' }}
        AWS_DEFAULT_REGION: 'us-east-1'

    # Aplicação controlada da infraestrutura (executada apenas num push na branch principal e se autorizada)

    - name: Aplicar Infraestrutura
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || 'test'}}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || 'test' }}
        AWS_DEFAULT_REGION: 'us-east-1'